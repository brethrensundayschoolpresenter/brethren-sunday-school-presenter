name: Build Windows + Mac release
on:
  workflow_dispatch:
    inputs:
      test_only:
        description: 'Build + test only, do NOT publish'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      # Windows 10 / 11 (Electron 33, 64-bit) -> latest.yml
      - run: npx electron-builder --win nsis --x64 --publish never
      # Windows 7 / 8 (Electron 22, 32 + 64-bit in one installer) -> win7.yml
      - run: npx electron-builder --win nsis --ia32 --x64 --publish never --config build/legacy.js
      # SAFETY: open the real built app (Win 10/11 and Win 7/8 builds) and check it loads everything with no crash.
      # If a test fails the job stops here and NOTHING is published, so no user gets a broken version.
      - name: Test the Windows 10/11 app
        shell: bash
        run: |
          SS_SMOKE="$PWD/smoke-win.json" timeout 150 "dist/win-unpacked/Brethren Sunday School Presenter.exe" || true
          cat smoke-win.json
          node -e "process.exit(require('./smoke-win.json').ok === true ? 0 : 1)"
      - name: Test the Windows 7/8 app (Electron 22)
        shell: bash
        run: |
          SS_SMOKE="$PWD/smoke-win7.json" timeout 150 "dist-legacy/win-unpacked/Brethren Sunday School Presenter.exe" || true
          cat smoke-win7.json
          node -e "process.exit(require('./smoke-win7.json').ok === true ? 0 : 1)"
      - name: TEST BUILD only - keep the Windows installer to try by hand (nothing is published)
        if: ${{ inputs.test_only }}
        uses: actions/upload-artifact@v4
        with:
          name: test-windows
          path: dist/*.exe
          retention-days: 7
      - name: Publish the release as a DRAFT (users can't see it until the Mac test passes too)
        if: ${{ !inputs.test_only }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          sed "s/{V}/$V/g" build/release-notes.md > notes.md
          ls dist dist-legacy
          if [ "$(gh release view "v$V" --json isDraft -q .isDraft 2>/dev/null)" = "true" ]; then gh release delete "v$V" --yes; fi   # leftover draft of a failed run
          gh release create "v$V" --draft dist/*.exe dist/*.blockmap dist/latest.yml dist-legacy/*.exe dist-legacy/*.blockmap dist-legacy/win7.yml How-to-Install.pdf --title "Brethren Sunday School Presenter - ترانيم مدارس الأحد $V" --notes-file notes.md
  mac:
    # Mac (universal: Apple Silicon + Intel), ad-hoc signed (no Apple account) -> added to the same release
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx electron-builder --mac dmg --universal --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test the Mac app
        run: |
          APP="$(ls -d dist/mac*/*.app | head -1)"
          echo "$APP"
          SS_SMOKE="$PWD/smoke-mac.json" "$APP/Contents/MacOS/Brethren Sunday School Presenter" &
          P=$!; for i in $(seq 1 150); do kill -0 $P 2>/dev/null || break; sleep 1; done; kill $P 2>/dev/null || true
          cat smoke-mac.json
          node -e "process.exit(require('./smoke-mac.json').ok === true ? 0 : 1)"
          mkdir -p out && cp dist/*.dmg out/
      # smaller Mac copies (about half the size): Apple Silicon only + Intel only. The universal one above stays for anyone we can't detect.
      - run: npx electron-builder --mac dmg --arm64 --x64 --publish never -c.dmg.artifactName='Brethren-Sunday-School-Presenter-Mac-${arch}-${version}.${ext}'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test the Apple Silicon copy and the Intel copy
        run: |
          ls dist
          V=$(node -p "require('./package.json').version")
          softwareupdate --install-rosetta --agree-to-license >/dev/null 2>&1 || true
          t() { APP="$(ls -d "$1"/*.app | head -1)"; echo "$APP"; rm -f smoke-$2.json
            SS_SMOKE="$PWD/smoke-$2.json" $3 "$APP/Contents/MacOS/Brethren Sunday School Presenter" &
            P=$!; for i in $(seq 1 150); do kill -0 $P 2>/dev/null || break; sleep 1; done; kill $P 2>/dev/null || true
            cat smoke-$2.json; node -e "process.exit(require('./smoke-$2.json').ok === true ? 0 : 1)"; }
          t dist/mac-arm64 arm ""
          t dist/mac intel "arch -x86_64"
          mv "dist/Brethren-Sunday-School-Presenter-Mac-arm64-$V.dmg" "out/Brethren-Sunday-School-Presenter-Mac-AppleSilicon-$V.dmg"
          mv "dist/Brethren-Sunday-School-Presenter-Mac-x64-$V.dmg" "out/Brethren-Sunday-School-Presenter-Mac-Intel-$V.dmg"
          ls -la out
      - name: TEST BUILD only - keep the Mac copies to try by hand (nothing is published)
        if: ${{ inputs.test_only }}
        uses: actions/upload-artifact@v4
        with:
          name: test-mac
          path: out/*.dmg
          retention-days: 7
      - name: Add the Mac copy and make the release public (only now users get it)
        if: ${{ !inputs.test_only }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          ls out
          gh release upload "v$V" out/*.dmg --clobber
          gh release edit "v$V" --draft=false --latest
