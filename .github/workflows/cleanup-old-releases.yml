name: Remove old releases (one time)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Delete releases 1.0.0 - 1.0.5 and their tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          for v in 1.0.0 1.0.1 1.0.2 1.0.3 1.0.4 1.0.5; do
            gh release delete "v$v" --yes --cleanup-tag || true
          done
          gh release list
